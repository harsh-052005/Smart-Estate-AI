# ==============================================================================
# Smart Estate AI — Render Blueprint (Infrastructure as Code)
# One-click deployment specification for Render (Free Tier Friendly)
# ==============================================================================

services:
  - type: web
    name: smart-estate-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/api/health"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
