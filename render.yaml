# ==============================================================================
# Smart Estate AI — Render Blueprint (Infrastructure as Code)
# Multi-Stage Docker Container Deployment (Free Tier Friendly)
# ==============================================================================

services:
  - type: web
    name: smart-estate-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: "/api/health"
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
